name: Build APK

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install Buildozer and dependencies
      run: |
        sudo apt update
        sudo apt install -y git zip unzip openjdk-17-jdk python3-pip autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5 cmake libffi-dev libssl-dev
        pip install --upgrade pip
        pip install buildozer cython

    - name: Build with Buildozer
      run: |
        buildozer init
        # buildozer.spec daxilindəki bəzi konfiqurasiyaları avtomatik tənzimləyirik
        sed -i 's/#title = My Application/title = Jarvis AI/' buildozer.spec
        sed -i 's/#package.name = myapp/package.name = jarvisai/' buildozer.spec
        sed -i 's/#package.domain = org.test/package.domain = org.jarvis/' buildozer.spec
        sed -i 's/#requirements = python3,kivy/requirements = python3,kivy,requests/' buildozer.spec
        sed -i 's/#osx.python_version = 3/osx.python_version = 3/' buildozer.spec
        sed -i 's/#android.permissions = INTERNET/android.permissions = INTERNET/' buildozer.spec
        buildozer -v android debug

    - name: Upload APK artifact
      uses: actions/upload-artifact@v4
      with:
        name: Jarvis-APK
        path: bin/*.apk
