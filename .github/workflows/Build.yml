name: Build Jarvis APK

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Create Android Project Structure and Insert Jarvis App
      run: |
        mkdir -p app/src/main/java/com/jarvis/ai app/src/main/assets app/src/main/res/values
        
        # Sənin göndərdiyin Jarvis HTML/JS interfeysi birbaşa assets qovluğuna yazılır
        cat << 'EOF' > app/src/main/assets/index.html
        <!DOCTYPE html>
        <html lang="az"><head><meta charset="utf-8">
        <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
        <title>JARVIS AI</title>
        <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
        <style>
        :root{
          --bg:#05070d;
          --panel:rgba(13, 18, 30, 0.75);
          --panel-border:rgba(255, 255, 255, 0.1);
          --primary:#00f2fe;
          --primary-glow:rgba(0, 242, 254, 0.35);
          --bubble-me:linear-gradient(135deg, #00c6ff, #0072ff);
          --bubble-ai:rgba(20, 28, 45, 0.85);
          --text:#f1f5f9;
          --muted:#94a3b8;
        }
        *{box-sizing:border-box}
        html,body{height:100%;margin:0;font-family:'Plus Jakarta Sans',-apple-system,sans-serif}
        body{background:var(--bg);color:var(--text);display:flex;flex-direction:column;overflow:hidden;height:100vh;transition:background 0.4s ease}
        body::before{
          content:'';position:fixed;top:-10%;left:50%;transform:translateX(-50%);
          width:600px;height:300px;background:var(--primary-glow);
          filter:blur(140px);border-radius:50%;pointer-events:none;z-index:0;
        }
        #loginOverlay{
          position:fixed;inset:0;background:rgba(5, 7, 13, 0.95);z-index:99;
          display:flex;align-items:center;justify-content:center;padding:20px;backdrop-filter:blur(20px);
        }
        .loginCard{
          width:100%;max-width:390px;background:var(--panel);
          border:1px solid var(--panel-border);padding:36px 28px;border-radius:28px;
          box-shadow:0 0 50px var(--primary-glow), inset 0 0 20px rgba(255,255,255,0.02);
          text-align:center;position:relative;overflow:hidden;
        }
        .loginCard h2{
          font-family:'Space Grotesk',sans-serif;margin:0 0 8px 0;font-size:32px;font-weight:700;
          letter-spacing:2px;color:var(--primary);text-shadow:0 0 20px var(--primary-glow);
        }
        .loginCard p{color:var(--muted);font-size:14px;margin-bottom:28px}
        #appContainer{display:flex;flex-direction:column;height:100%;width:100%;position:relative;z-index:1}
        #ustbar{display:flex;align-items:center;justify-content:space-between;
          background:var(--panel);backdrop-filter:blur(20px);border-bottom:1px solid var(--panel-border);
          padding:14px 22px;flex:0 0 auto}
        #ustbar h1{font-family:'Space Grotesk',sans-serif;font-size:22px;margin:0;font-weight:700;letter-spacing:2px;color:var(--primary);text-shadow:0 0 12px var(--primary-glow)}
        #ayarBtn{background:rgba(255,255,255,0.05);border:1px solid var(--panel-border);color:var(--text);font-size:18px;cursor:pointer;padding:8px 12px;border-radius:14px;transition:0.3s}
        #sohbet{flex:1 1 auto;overflow-y:auto;padding:20px;display:flex;flex-direction:column;gap:14px}
        .balon{max-width:82%;padding:14px 20px;border-radius:20px;line-height:1.55;font-size:15px;word-wrap:break-word;white-space:pre-wrap;box-shadow:0 8px 25px rgba(0,0,0,0.3)}
        .ben{align-self:flex-end;background:var(--bubble-me);color:#fff;border-bottom-right-radius:4px;font-weight:500}
        .ai{align-self:flex-start;background:var(--bubble-ai);border:1px solid var(--panel-border);backdrop-filter:blur(12px);border-bottom-left-radius:4px;color:#e2e8f0}
        .hata{align-self:center;color:#ff6b6b;background:rgba(255,107,107,0.1);border:1px solid rgba(255,107,107,0.25);padding:10px 20px;border-radius:24px;font-size:13px}
        #durum{color:var(--primary);font-size:13px;padding:0 22px;height:24px;flex:0 0 auto;font-weight:600;letter-spacing:0.5px}
        #altbar{display:flex;align-items:center;gap:10px;padding:14px 18px;background:var(--panel);backdrop-filter:blur(20px);border-top:1px solid var(--panel-border);flex:0 0 auto}
        #giris{flex:1;font-size:15px;padding:13px 20px;background:rgba(10, 15, 26, 0.75);color:var(--text);border:1px solid var(--panel-border);border-radius:28px;outline:none;transition:0.3s}
        #giris:focus{border-color:var(--primary);box-shadow:0 0 20px var(--primary-glow)}
        .iconBtn{flex:0 0 auto;width:46px;height:46px;border-radius:50%;border:none;background:var(--primary);color:#05070d;font-size:19px;display:flex;align-items:center;justify-content:center;cursor:pointer;transition:0.3s;box-shadow:0 0 15px var(--primary-glow);font-weight:bold}
        #panel{position:fixed;inset:0;background:rgba(0,0,0,0.7);backdrop-filter:blur(8px);display:none;z-index:10}
        #panel.acik{display:block}
        #panelIc{position:absolute;top:0;right:0;width:85%;max-width:370px;height:100%;background:#0a0e1a;border-left:1px solid var(--panel-border);padding:26px;overflow-y:auto}
        #panelIc h2{font-family:'Space Grotesk',sans-serif;font-size:22px;margin-top:0;margin-bottom:22px;font-weight:700}
        .grup{margin-bottom:22px;background:rgba(255,255,255,0.02);padding:18px;border-radius:20px;border:1px solid var(--panel-border)}
        .grup label{display:block;font-size:13px;color:var(--muted);margin-bottom:12px;font-weight:600;text-transform:uppercase;letter-spacing:1px}
        .renkler{display:grid;grid-template-columns:repeat(3, 1fr);gap:10px}
        .renkTus{height:42px;border-radius:12px;border:2px solid transparent;cursor:pointer;transition:0.3s;font-size:11px;font-weight:bold;color:#fff;display:flex;align-items:center;justify-content:center}
        .dilTus{padding:9px 15px;border-radius:12px;border:1px solid var(--panel-border);background:rgba(255,255,255,0.04);color:var(--text);margin-right:6px;margin-bottom:6px;cursor:pointer;font-size:13px;font-weight:500}
        .dilTus.secili{background:var(--primary);border-color:var(--primary);color:#05070d;font-weight:700}
        #kapatBtn{position:absolute;top:22px;left:22px;background:rgba(255,255,255,0.05);border:1px solid var(--panel-border);color:var(--text);width:38px;height:38px;border-radius:50%;font-size:16px;cursor:pointer}
        .inputKutusu{width:100%;padding:13px 16px;margin-bottom:14px;background:rgba(10,15,26,0.9);color:var(--text);border:1px solid var(--panel-border);border-radius:14px;outline:none;font-size:14px}
        .hesapBtn{width:100%;padding:13px;background:var(--primary);border:none;color:#05070d;border-radius:14px;cursor:pointer;font-weight:700;font-size:14px;margin-bottom:10px}
        .balon img{max-width:100%;border-radius:14px;margin-top:10px;display:block;border:1px solid var(--panel-border)}
        </style></head><body>
        <div id="appContainer">
          <div id="ustbar"><h1>JARVIS AI</h1><button id="ayarBtn" onclick="panelAc()">⚙️</button></div>
          <div id="sohbet"></div>
          <div id="durum"></div>
          <div id="altbar">
            <input id="giris" placeholder="Jarvis-ə sual verin..." onkeydown="if(event.key==='Enter')gonder()">
            <button class="iconBtn" onclick="gonder()">➔</button>
          </div>
        </div>
        <div id="panel">
          <div id="panelIc">
            <button id="kapatBtn" onclick="panelKapat()">✕</button>
            <h2>Menyu</h2>
            <div class="grup">
              <label>API Key (Gemini)</label>
              <input type="password" id="apiKeyInput" class="inputKutusu" placeholder="API Key daxil edin">
              <button class="hesapBtn" onclick="ApiKeyYaddaSaxla()">Yadda saxla</button>
            </div>
          </div>
        </div>
        <script>
        var KEY = localStorage.getItem("jarvis_key") || "AQ.Ab8RN6JasOT9ccy3e3vardxFtUgY1LZPm28IfQKvpZu3xTU2LA";
        if(document.getElementById("apiKeyInput")) document.getElementById("apiKeyInput").value = KEY;
        function ApiKeyYaddaSaxla(){
          KEY = document.getElementById("apiKeyInput").value.trim();
          localStorage.setItem("jarvis_key", KEY);
          alert("API Key yadda saxlandı!");
          panelKapat();
        }
        var sohbet = document.getElementById("sohbet");
        var giris = document.getElementById("giris");
        var durum = document.getElementById("durum");
        var hist = [];
        function panelAc(){ document.getElementById("panel").classList.add("acik"); }
        function panelKapat(){ document.getElementById("panel").classList.remove("acik"); }
        function ekleEkrana(kim, metin, sinif){
          var p=document.createElement("div");
          p.className = "balon " + sinif;
          p.textContent = metin;
          sohbet.appendChild(p);
          p.scrollIntoView({behavior:"smooth", block:"end"});
          return p;
        }
        async function gonder(){
          var s = giris.value.trim();
          if(!s) return;
          giris.value = "";
          ekleEkrana("Sən", s, "ben");
          hist.push({role:"user", parts:[{text:s}]});
          durum.textContent = "Jarvis düşünür...";
          var balon = ekleEkrana("Jarvis", "", "ai");
          try{
            var r = await fetch("https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=" + KEY, {
              method:"POST",
              headers:{"Content-Type":"application/json"},
              body: JSON.stringify({contents: hist})
            });
            var data = await r.json();
            var cevap = data.candidates[0].content.parts[0].text;
            balon.textContent = cevap;
            hist.push({role:"model", parts:[{text:cevap}]});
          }catch(e){
            balon.textContent = "Xəta baş verdi: API açarını yoxlayın.";
          }
          durum.textContent = "";
        }
        </script></body></html>
        EOF

        cat << 'EOF' > app/src/main/AndroidManifest.xml
        <manifest xmlns:android="http://schemas.android.com/apk/res/android"
            package="com.jarvis.ai">
            <uses-permission android:name="android.permission.INTERNET" />
            <application
                android:label="Jarvis AI"
                android:theme="@android:style/Theme.NoTitleBar.Fullscreen">
                <activity
                    android:name=".MainActivity"
                    android:exported="true">
                    <intent-filter>
                        <action android:name="android.intent.action.MAIN" />
                        <category android:name="android.intent.category.LAUNCHER" />
                    </intent-filter>
                </activity>
            </application>
        </manifest>
        EOF

        cat << 'EOF' > app/src/main/java/com/jarvis/ai/MainActivity.java
        package com.jarvis.ai;
        import android.app.Activity;
        import android.os.Bundle;
        import android.webkit.WebSettings;
        import android.webkit.WebView;
        import android.webkit.WebViewClient;

        public class MainActivity extends Activity {
            @Override
            protected void onCreate(Bundle savedInstanceState) {
                super.onCreate(savedInstanceState);
                WebView webView = new WebView(this);
                WebSettings settings = webView.getSettings();
                settings.setJavaScriptEnabled(true);
                settings.setDomStorageEnabled(true);
                settings.setDatabaseEnabled(true);
                webView.setWebViewClient(new WebViewClient());
                webView.loadUrl("file:///android_asset/index.html");
                setContentView(webView);
            }
        }
        EOF

        cat << 'EOF' > build.gradle
        buildscript {
            repositories {
                google()
                mavenCentral()
            }
            dependencies {
                classpath 'com.android.tools.build:gradle:7.4.2'
            }
        }
        allprojects {
            repositories {
                google()
                mavenCentral()
            }
        }
        EOF

        cat << 'EOF' > settings.gradle
        include ':app'
        EOF

        cat << 'EOF' > app/build.gradle
        plugins {
            id 'com.android.application'
        }
        android {
            namespace 'com.jarvis.ai'
            compileSdk 33
            defaultConfig {
                applicationId "com.jarvis.ai"
                minSdk 24
                targetSdk 33
                versionCode 1
                versionName "1.0"
            }
        }
        EOF

        echo "sdk.dir=$ANDROID_HOME" > local.properties

    - name: Build with Gradle
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: 7.5

    - name: Build Debug APK
      run: gradle assembleDebug

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: Jarvis-WebView-APK
        path: app/build/outputs/apk/debug/app-debug.apk
