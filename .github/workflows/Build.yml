def system_command_run(cmd_str):
    cmd = cmd_str.strip().lower()
    try:
        if cmd.startswith("http://") or cmd.startswith("https://"):
            os.system(f'start "" "{cmd}"')
        elif "chrome" in cmd:
            subprocess.Popen(["cmd", "/c", "start", "chrome"], shell=True)
        elif "notepad" in cmd or "bloknot" in cmd:
            subprocess.Popen(["notepad.exe"])
        elif "calc" in cmd or "hesab" in cmd:
            subprocess.Popen(["calc.exe"])
        elif "explorer" in cmd or "qovluq" in cmd:
            subprocess.Popen(["explorer.exe"])
        else:
            subprocess.Popen(["cmd", "/c", "start", cmd], shell=True)
