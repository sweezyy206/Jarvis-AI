"""
def gemini_stream(model, body):
    req = urllib.request.Request(
        STREAM_API.format(model), data=body,
        headers={"Content-Type": "application/json", "x-goog-api-key": KEY, "Accept-Encoding": "identity"})
    resp = urllib.request.urlopen(req, timeout=15)
    for raw in resp:
        line = raw.decode("utf-8", "ignore").strip()
        if not line.startswith("data:"): continue
        parca = line[len("data:"):].strip()
        if not parca or parca == "[DONE]": continue
        try:
            d = json.loads(parca)
            parts = d["candidates"][0]["content"]["parts"]
            metin = "".join(p.get("text", "") for p in parts)
        except Exception: continue
        if metin: yield metin
class Handler(BaseHTTPRequestHandler):
    def log_message(self, *a): pass
    def _send(self, code, ctype, data):
        self.send_response(code)
        self.send_header("Content-Type", ctype)
        self.send_header("Content-Length", str(len(data)))
        self.end_headers()
        self.wfile.write(data)
    def do_GET(self):
        if self.path.split("?")[0] in ("/", "/index.html", "/jarvis.html"):
            self._send(200, "text/html; charset=utf-8", HTML.encode("utf-8"))
        else:
            self._send(404, "text/plain; charset=utf-8", b"yok")
    def do_POST(self):
        n = int(self.headers.get("Content-Length", "0"))
        payload = json.loads(self.rfile.read(n).decode("utf-8")) if n > 0 else {}
        if self.path == "/auth_check":
            session = read_json(SESSION_FILE, {})
            out = json.dumps({"user": session.get("user")})
            self._send(200, "application/json", out.encode("utf-8"))
            return
        elif self.path == "/login":
            users = read_json(USERS_FILE, {})
            u, p = payload.get("u"), payload.get("p")
            if users.get(u) == p:
                write_json(SESSION_FILE, {"user": u})
                out = json.dumps({"ok": True})
            else:
                out = json.dumps({"ok": False})
            self._send(200, "application/json", out.encode("utf-8"))
            return
        elif self.path == "/register":
            users = read_json(USERS_FILE, {})
            u, p = payload.get("u"), payload.get("p")
            if u in users:
                out = json.dumps({"ok": False})
            else:
                users[u] = p
                write_json(USERS_FILE, users)
                write_json(SESSION_FILE, {"user": u})
                out = json.dumps({"ok": True})
            self._send(200, "application/json", out.encode("utf-8"))
            return
        elif self.path == "/logout":
            write_json(SESSION_FILE, {})
            self._send(200, "application/json", b'{"ok":true}')
            return
        elif self.path == "/get_chats":
            session = read_json(SESSION_FILE, {})
            user = session.get("user")
            all_chats = read_json(CHATS_FILE, {})
            user_chats = all_chats.get(user, {}) if user else {}
            out = json.dumps({"chats": user_chats})
            self._send(200, "application/json", out.encode("utf-8"))
            return
        elif self.path == "/save_chat":
            session = read_json(SESSION_FILE, {})
            user = session.get("user")
            if user:
                all_chats = read_json(CHATS_FILE, {})
                if user not in all_chats: all_chats[user] = {}
                cid = payload.get("id")
                all_chats[user][cid] = {"title": payload.get("title"), "history": payload.get("history")}
                write_json(CHATS_FILE, all_chats)
            self._send(200, "application/json", b'{"ok":true}')
            return
        elif self.path == "/ask":
            hist = payload.get("history", [])[-20:]
            while hist and hist[0].get("role") != "user": hist = hist[1:]
            lang = payload.get("lang", "az")
            if lang not in SYSTEM: lang = "az"
            body = json.dumps({
                "system_instruction": {"parts": [{"text": SYSTEM[lang]}]},
                "contents": hist,
                "generationConfig": {"maxOutputTokens": 300},
            }).encode("utf-8")
            akis, ilk_parca = None, None
            for model in MODELS:
                try:
                    aday = gemini_stream(model, body)
                    ilk_parca = next(aday)
                    akis = aday
                    break
                except Exception: pass
            if akis is None:
                out = json.dumps({"ok": False, "text": "Server cavab vermedi."}, ensure_ascii=False)
                self._send(200, "application/json; charset=utf-8", out.encode("utf-8"))
                return
            self.send_response(200)
            self.send_header("Content-Type", "text/plain; charset=utf-8")
            self.close_connection = True
            self.end_headers()
            full_resp = ilk_parca
            try:
                self.wfile.write(ilk_parca.encode("utf-8"))
                self.wfile.flush()
                for parca in akis:
                    full_resp += parca
                    self.wfile.write(parca.encode("utf-8"))
                    self.wfile.flush()
                # Check for CMD instruction and execute
                cmd_match = re.search(r'\[CMD:(.*?)\]', full_resp)
                if cmd_match:
                    cmd_to_run = cmd_match.group(1).strip()
                    threading.Thread(target=system_command_run, args=(cmd_to_run,), daemon=True).start()
            except Exception: pass
def start_server():
    srv = ThreadingHTTPServer(("127.0.0.1", 8008), Handler)
    srv.serve_forever()
