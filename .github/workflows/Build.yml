  panelKapat();
  initSystem();
}
function seklSecildi(e){
  var file = e.target.files[0];
  if(!file) return;
  var reader = new FileReader();
  reader.onload = function(evt){
    secilenSekilBase64 = evt.target.result;
    document.getElementById("imgPreview").src = secilenSekilBase64;
    document.getElementById("previewKutusu").style.display = "flex";
  };
  reader.readAsDataURL(file);
}
function sekliSil(){
  secilenSekilBase64 = null;
  document.getElementById("fileInput").value = "";
  document.getElementById("previewKutusu").style.display = "none";
}
async function chatSiyahisiniYukle(){
  var t = METIN[dil];
  var res = await api("/get_chats", {});
  var chats = res.chats || {};
  var kutu = document.getElementById("chatSiyahisi");
  kutu.innerHTML = "";
  var keys = Object.keys(chats).reverse();
  if(keys.length === 0){ await yeniSohbetAc(); return; }
  if(!currentChatId || !chats[currentChatId]) currentChatId = keys[0];
  keys.forEach(function(id){
    var item = document.createElement("div");
    item.className = "chatItem" + (id === currentChatId ? " aktiv" : "");
    item.textContent = chats[id].title || (t.yeniSohbetBasliq + " " + id);
    item.onclick = function(){ sohbetiSec(id); panelKapat(); };
    kutu.appendChild(item);
  });
  hist = chats[currentChatId].history || [];
  ekranaYukle();
}
async function yeniSohbetAc(){
  currentChatId = Date.now().toString();
  hist = [];
  await api("/save_chat", {id: currentChatId, title: METIN[dil].yeniSohbetBasliq, history: []});
  await chatSiyahisiniYukle();
  panelKapat();
}
function sohbetiSec(id){
  currentChatId = id;
  chatSiyahisiniYukle();
}
function ekranaYukle(){
  var t = METIN[dil];
  sohbet.innerHTML = "";
  hist.forEach(function(item){
    var metinText = "";
    var imgUrl = item.gen_image || null;
    item.parts.forEach(function(p){
      if(p.text) metinText += p.text;
      if(p.inline_data) imgUrl = "data:" + p.inline_data.mime_type + ";base64," + p.inline_data.data;
    });
    if(item.role === "user") ekleEkrana(t.sen, metinText, "ben", imgUrl);
    else if(item.role === "model") ekleEkrana(t.jarvis, metinText, "ai", imgUrl);
  });
}
function renkKutusuOlustur(){
  var kutu = document.getElementById("renkKutu");
  kutu.innerHTML = "";
  THEMES.forEach(function(tm, idx){
    var b = document.createElement("button");
    b.className = "renkTus" + (idx === selectedThemeIdx ? " secili" : "");
    b.style.background = tm.primary;
    b.style.color = idx === 5 ? "#fff" : "#000";
    b.textContent = tm.name;
    b.onclick = function(){ themeUygula(idx); };
    kutu.appendChild(b);
  });
}
function dilSec(d){ dil = d; uygula(); }
function panelAc(){ document.getElementById("panel").classList.add("acik"); }
function panelKapat(){ document.getElementById("panel").classList.remove("acik"); }
function ekleEkrana(kim, metin, sinif, imgUrl){
  var p=document.createElement("div");
  p.className = "balon " + sinif;
  p.textContent = metin;
  if(imgUrl){
    var img = document.createElement("img");
    img.src = imgUrl;
    p.appendChild(img);
  }
  sohbet.appendChild(p);
  p.scrollIntoView({behavior:"smooth", block:"end"});
  return p;
}
function gonder(){
  var s=giris.value.trim();
  if(s || secilenSekilBase64){ giris.value=""; sor(s); }
}
async function saveCurrentChat(title){
  await api("/save_chat", {id: currentChatId, title: title, history: hist});
}
async function sor(s){
  var t = METIN[dil];
  if(mesgul) return;
  if(!currentChatId) await yeniSohbetAc();
  mesgul = true;
  var gonderilecekParts = [];
  var currentImg = secilenSekilBase64;
  if(s) gonderilecekParts.push({text: s});
  if(currentImg){
    var splitted = currentImg.split(",");
    var mime = splitted[0].match(/:(.*?);/)[1];
    var data = splitted[1];
    gonderilecekParts.push({ inline_data: { mime_type: mime, data: data } });
  }
  ekleEkrana(t.sen, s, "ben", currentImg);
  sekliSil();
  hist.push({role:"user", parts: gonderilecekParts});
  durum.textContent = t.dusunuyor;
  var balon = ekleEkrana(t.jarvis, "", "ai");
  var tamMetin = "";
  try{
    var r = await fetch("/ask", {method:"POST", headers:{"Content-Type":"application/json"}, body: JSON.stringify({history:hist, lang:dil})});
    var reader = r.body.getReader();
    var decoder = new TextDecoder("utf-8");
    durum.textContent = "";
    while(true){
      var parca = await reader.read();
      if(parca.done) break;
      tamMetin += decoder.decode(parca.value, {stream:true});
      var imgMatch = tamMetin.match(/\[IMAGE:(.*?)\]/);
      var genImgUrl = null;
      var cleanText = tamMetin.replace(/\[CMD:(.*?)\]/g, '');
      if(imgMatch){
        var prompt = imgMatch[1].trim();
        genImgUrl = "https://image.pollinations.ai/prompt/" + encodeURIComponent(prompt) + "?width=1024&height=768&model=flux&nologo=true";
        cleanText = cleanText.replace(/\[IMAGE:(.*?)\]/g, '').trim();
      }
      balon.textContent = cleanText.trim();
      if(genImgUrl && !balon.querySelector("img")){
        var img = document.createElement("img");
        img.src = genImgUrl;
        balon.appendChild(img);
      }
      balon.scrollIntoView({behavior:"smooth", block:"end"});
    }
    if(tamMetin){
      var itemObj = {role:"model", parts:[{text:cleanText}]};
      if(genImgUrl) itemObj.gen_image = genImgUrl;
      hist.push(itemObj);
      await saveCurrentChat(s ? s.substring(0,20) + "..." : "Söhbət");
    }else{
      hist.pop(); balon.remove();
      ekleEkrana(t.hata, t.baglantiYok, "hata");
    }
  }catch(e){
    hist.pop(); balon.remove();
    durum.textContent = "";
    ekleEkrana(t.hata, t.baglantiYok, "hata");
  }
  durum.textContent = ""; mesgul = false;
}
uygula();
initSystem();
