name: Build Jarvis WebView APK
on:
  push:
    branches: [ main ]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
- name: Checkout code
      uses: actions/checkout@v4
- name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'
- name: Create Android Project Structure and Insert Jarvis Code
      run: |
        mkdir -p app/src/main/java/com/jarvis/ai app/src/main/assets app/src/main/res/values
        # Jarvis-in HTML kodu birbaşa assets qovluğuna yazılır
        cat << 'EOF' > app/src/main/assets/index.html
