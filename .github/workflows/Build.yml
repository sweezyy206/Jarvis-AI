}
async function overlayGirisYap(){
  var t = METIN[dil];
  var u = document.getElementById("loginUser").value.trim();
  var p = document.getElementById("loginPass").value.trim();
  var res = await api("/login", {u:u, p:p});
  if(res.ok){
    alert(t.alertLoginSuccess);
    initSystem();
  }else alert(t.alertLoginError);
}
async function overlayQeydiyyatOl(){
  var t = METIN[dil];
  var u = document.getElementById("loginUser").value.trim();
  var p = document.getElementById("loginPass").value.trim();
  if(!u || !p){ alert(t.alertBosInput); return; }
  var res = await api("/register", {u:u, p:p});
  if(res.ok){
    alert(t.alertRegSuccess);
    initSystem();
  }else alert(t.alertUserExists);
}
async function cixisYap(){
